name: Pages
#
# GitHub Pages is configured for the "GitHub Actions" source. Pages artifact
# deploys are whole-site snapshots, so this workflow is the only Pages deployer
# and always assembles the Astro site plus the extension repository before
# uploading one final Pages artifact.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'scripts/pages_extension_repository.py'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_extension:
        description: Build and publish unsigned extension binaries before deploying Pages
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  EXT_NAME: otlp
  DUCKDB_VERSION: v1.5.5

jobs:
  extension-build:
    name: build extension binaries
    if: ${{ github.event_name == 'release' || inputs.publish_extension }}
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.5
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5.5
      extension_name: otlp
      extra_toolchains: rust
      # Kept in sync with MainDistributionPipeline.yml: a platform the release pipeline
      # builds but this one excludes is a platform users cannot INSTALL from the Pages
      # repository, which is how the v0.7.0 repository ended up with no Windows binary.
      # windows_amd64 (MSVC) is back on: DuckDB v1.5.5's bundled fmt no longer references
      # `stdext::checked_array_iterator` (the removed MSVC extension that broke every Windows
      # build through v1.5.3 with C2653/C7525), and src/otlp_server.cpp guards its POSIX-only
      # socket headers behind `#ifdef _WIN32` with a Winsock equivalent (issue #37).
      # windows_amd64_mingw stays excluded: the rtools42 gcc toolchain also needs the
      # x86_64-pc-windows-gnu Rust target for otlp2records, which has never been validated here.
      exclude_archs: "wasm_mvp;wasm_threads;linux_amd64_musl;windows_amd64_mingw"

  extension-package:
    name: package extension repository
    if: ${{ github.event_name == 'release' || inputs.publish_extension }}
    runs-on: ubuntu-latest
    needs: extension-build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: ${{ env.EXT_NAME }}-${{ env.DUCKDB_VERSION }}-extension-*

      - name: Assemble extension repository
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          prefix="${EXT_NAME}-${DUCKDB_VERSION}-extension-"
          found=0
          mkdir -p _extension_repository
          for dir in artifacts/${prefix}*/; do
            arch="$(basename "$dir")"
            arch="${arch#${prefix}}"
            out="_extension_repository/${DUCKDB_VERSION}/${arch}"
            mkdir -p "$out"

            # WASM artifacts ship as <name>.duckdb_extension.wasm and are loaded by
            # duckdb-wasm over plain HTTP. The canonical repository serves them
            # brotli-compressed with `Content-Encoding: br`, but GitHub Pages cannot set
            # that header, so publish the wasm binary UNCOMPRESSED: the browser fetch then
            # hands raw wasm to the loader, exactly like the in-repo wasm demo
            # (site/public/wasm-demo/) does today.
            if [[ "$arch" == wasm* ]]; then
              src="${dir}${EXT_NAME}.duckdb_extension.wasm"
              if [ ! -f "$src" ]; then
                echo "::error::no ${EXT_NAME}.duckdb_extension.wasm in ${dir} for ${arch}"
                exit 1
              fi
              # Normalize to the unsigned 256-byte zero signature, then publish raw.
              cp "$src" work.bin
              truncate -s -256 work.bin
              dd if=/dev/zero bs=256 count=1 status=none >> work.bin
              mv work.bin "${out}/${EXT_NAME}.duckdb_extension.wasm"
              echo "packaged ${arch} (wasm, uncompressed)"
              found=$((found + 1))
              continue
            fi

            src="${dir}${EXT_NAME}.duckdb_extension"
            if [ ! -f "$src" ]; then
              echo "::error::no ${EXT_NAME}.duckdb_extension in ${dir} for ${arch}"
              exit 1
            fi
            # Match the official unsigned packaging: replace any existing
            # signature placeholder with the unsigned 256-byte zero signature,
            # then gzip for DuckDB's native extension repository path.
            cp "$src" work.bin
            truncate -s -256 work.bin
            dd if=/dev/zero bs=256 count=1 status=none >> work.bin
            gzip -n < work.bin > "${out}/${EXT_NAME}.duckdb_extension.gz"
            rm -f work.bin
            echo "packaged ${arch}"
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no extension binaries found to package"
            exit 1
          fi
          echo "Packaged ${found} platform(s) for ${DUCKDB_VERSION}"

      - name: Write extension repository index
        shell: bash
        env:
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          mkdir -p _extension_repository/extensions
          {
            echo "<!doctype html><meta charset=utf-8>"
            echo "<title>duckdb-otlp extension repository</title>"
            echo "<h1>duckdb-otlp extension repository</h1>"
            echo "<p>Unsigned DuckDB extension repository. Requires DuckDB <code>${DUCKDB_VERSION}</code>.</p>"
            echo "<pre>SET allow_unsigned_extensions = true;"
            echo "INSTALL ${EXT_NAME} FROM '${PAGES_BASE_URL}';"
            echo "LOAD ${EXT_NAME};</pre>"
            echo "<h2>Available binaries</h2><ul>"
            for f in $(cd _extension_repository && find "${DUCKDB_VERSION}" \( -name '*.duckdb_extension.gz' -o -name '*.duckdb_extension.wasm' \) | sort); do
              echo "<li><a href=\"../${f}\">${f}</a></li>"
            done
            echo "</ul>"
          } > _extension_repository/extensions/index.html
          touch _extension_repository/.nojekyll

      - name: Archive extension repository
        run: tar -czf extension-repository.tar.gz -C _extension_repository .

      - name: Upload extension repository artifact
        uses: actions/upload-artifact@v7
        with:
          name: extension-repository
          path: extension-repository.tar.gz
          retention-days: 30

      - name: Upload extension repository release asset
        # Gate on the ref, not the event: MainDistributionPipeline dispatches this workflow on
        # the tag after cutting the release, and `github.event.release` is empty on a dispatch.
        # github.ref_name is the tag under both a tag dispatch and a release event.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job only downloads artifacts and never checks out the repo, so gh has no git
          # remote to infer the target from and would fail with "not a git repository".
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.ref_name }}" extension-repository.tar.gz --clobber

  deploy:
    name: deploy site
    runs-on: ubuntu-latest
    needs: extension-package
    if: ${{ always() && (needs.extension-package.result == 'success' || needs.extension-package.result == 'skipped') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        env:
          ASTRO_TELEMETRY_DISABLED: 1
        run: npm run check && npm run build

      - name: Download extension repository from this run
        if: needs.extension-package.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: extension-repository
          path: _extension_repository_artifact

      - name: Add extension repository from this run
        if: needs.extension-package.result == 'success'
        run: >-
          python3 scripts/pages_extension_repository.py
          --archive _extension_repository_artifact/extension-repository.tar.gz
          --destination site/dist

      - name: Restore published extension repository
        if: needs.extension-package.result == 'skipped'
        env:
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: >-
          python3 scripts/pages_extension_repository.py
          --base-url "$PAGES_BASE_URL"
          --destination site/dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
