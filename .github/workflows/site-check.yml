name: Documentation checks

on:
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/pages_extension_repository.py'
      - 'test/pages/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/site-check.yml'
      - 'renovate.json'
      - 'scripts/check_site_links.py'
      - '.github/actions/setup-mdbook/**'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/pages_extension_repository.py'
      - 'test/pages/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/site-check.yml'
      - 'renovate.json'
      - 'scripts/check_site_links.py'
      - '.github/actions/setup-mdbook/**'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Check and build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mdbook
      - name: Test extension repository preservation
        run: python3 -m unittest discover -s test/pages -v
      - name: Build the site
        working-directory: site
        run: mdbook build
      - name: Check internal links and anchors
        run: python3 scripts/check_site_links.py site/dist
