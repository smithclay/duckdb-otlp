#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'demo/**'
      - 'site/**'
      - 'notebooks/**'
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'demo/**'
      - 'site/**'
      - 'notebooks/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  # The DuckDB version the daemon reports, pinned to a released one. Keep in sync with the
  # DUCKDB_VERSION ARG in docker/duckdb-otlp-server/Dockerfile: the container reuses it to
  # match its pre-primed extension cache, and a standalone binary needs it so its runtime
  # INSTALL of ducklake/httpfs/... resolves to a published build.
  DAEMON_DUCKDB_VERSION: v1.5.5

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.5
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5.5
      extension_name: otlp
      extra_toolchains: rust
      # windows_amd64 (MSVC) is back on: DuckDB v1.5.5's bundled fmt no longer references
      # `stdext::checked_array_iterator` (the removed MSVC extension that broke every Windows
      # build through v1.5.3 with C2653/C7525), and src/otlp_server.cpp now guards its
      # POSIX-only socket headers behind `#ifdef _WIN32` with a Winsock equivalent (issue #37).
      # windows_amd64_mingw stays excluded: the rtools42 gcc toolchain also needs the
      # x86_64-pc-windows-gnu Rust target for otlp2records, which has never been validated here.
      exclude_archs: "wasm_mvp;wasm_threads;linux_amd64_musl;windows_amd64_mingw"

  # Cheap guard so daemon breakage fails on PRs and feature-branch pushes without paying
  # for the 2-arch publish path. Compiles amd64 natively and warms the shared cache
  # that the publish path (daemon-linux) reuses on main. Then packages that same amd64
  # binary into the runtime-prebuilt image (no recompile) and runs the local-ducklake
  # e2e smoke (scripts/smoke_test.py) so an ingest/seal/distroless-boot regression is
  # caught on the PR instead of only post-merge by docker-smoke on main.
  daemon-compile:
    name: Compile + config-test + e2e smoke daemon (amd64)
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compile daemon (amd64) and export the binary
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/duckdb-otlp-server/Dockerfile
          target: daemon-export
          platforms: linux/amd64
          outputs: type=local,dest=daemon-bin
          cache-from: type=gha,scope=daemon-amd64
          cache-to: type=gha,mode=max,scope=daemon-amd64

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Run daemon configuration and transport tests
        run: |
          chmod +x daemon-bin/duckdb-otlp-server
          DUCKDB_OTLP_SERVER_BIN="$PWD/daemon-bin/duckdb-otlp-server" \
            uv run --with pytest --with grpcio --with opentelemetry-proto --with duckdb==1.5.5 pytest test/server -q

      - name: Prepare Docker build context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docker-bin/amd64
          cp daemon-bin/duckdb-otlp-server docker-bin/amd64/duckdb-otlp-server
          chmod +x docker-bin/amd64/duckdb-otlp-server

      - name: Build amd64 runtime image (load)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/duckdb-otlp-server/Dockerfile
          target: runtime-prebuilt
          platforms: linux/amd64
          load: true
          tags: duckdb-otlp:smoke
          cache-from: type=gha,scope=docker-runtime

      - name: Install duckdb CLI (host, for Quack queries)
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip" -o /tmp/duckdb.zip
          sudo unzip -o /tmp/duckdb.zip -d /usr/local/bin
          duckdb --version

      - name: Run e2e smoke
        run: |
          python3 scripts/smoke_test.py \
            --image duckdb-otlp:smoke \
            --platform linux/amd64 \
            --startup-timeout 120

  daemon-linux:
    name: Build server daemon (${{ matrix.arch }})
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build daemon artifact
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/duckdb-otlp-server/Dockerfile
          target: daemon-export
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=daemon-out/${{ matrix.arch }}
          cache-from: type=gha,scope=daemon-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=daemon-${{ matrix.arch }}

      - name: Upload daemon artifact
        uses: actions/upload-artifact@v7
        with:
          name: duckdb-otlp-server-${{ matrix.arch }}
          path: daemon-out/${{ matrix.arch }}/duckdb-otlp-server
          if-no-files-found: error

  # End-to-end smoke before publishing: package the amd64 daemon into the runtime image
  # (reusing the compiled artifact, no recompile) and run a minimal local-ducklake e2e
  # (scripts/smoke_test.py): boot the distroless image, POST one fixed OTLP/JSON log
  # batch, flush, and assert the committed row count over Quack. A distroless-boot,
  # ingest, seal, or DuckLake-commit regression fails here and blocks the publish.
  docker-smoke:
    name: Docker e2e smoke (local-ducklake)
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    needs:
      - daemon-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download amd64 daemon artifact
        uses: actions/download-artifact@v8
        with:
          name: duckdb-otlp-server-amd64
          path: daemon-artifacts

      - name: Prepare Docker build context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docker-bin/amd64
          cp daemon-artifacts/duckdb-otlp-server docker-bin/amd64/duckdb-otlp-server
          chmod +x docker-bin/amd64/duckdb-otlp-server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build amd64 runtime image (load)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/duckdb-otlp-server/Dockerfile
          target: runtime-prebuilt
          platforms: linux/amd64
          load: true
          tags: duckdb-otlp:smoke
          cache-from: type=gha,scope=docker-runtime

      - name: Install duckdb CLI (host, for Quack queries)
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip" -o /tmp/duckdb.zip
          sudo unzip -o /tmp/duckdb.zip -d /usr/local/bin
          duckdb --version

      - name: Run e2e smoke
        run: |
          python3 scripts/smoke_test.py \
            --image duckdb-otlp:smoke \
            --platform linux/amd64 \
            --startup-timeout 120

  # Native macOS daemon builds. The Linux daemon comes out of a Docker stage, which cannot
  # produce a Darwin binary, so this is a separate job rather than two more matrix entries.
  # Both architectures build on the arm64 macos-15 runner: OSX_BUILD_ARCH drives
  # CMAKE_OSX_ARCHITECTURES and, through cmake/FindOtlp2Records.cmake, the Rust target — the
  # same cross-compile extension-ci-tools uses for osx_amd64 (config/distribution_matrix.json).
  # No vcpkg setup: vcpkg.json declares zlib for Windows only, so on macOS
  # find_package(ZLIB) resolves to the SDK's libz and vcpkg would install nothing.
  daemon-macos:
    name: Build server daemon (${{ matrix.arch }})
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: darwin-arm64
            osx_build_arch: arm64
            rust_target: aarch64-apple-darwin
          - arch: darwin-amd64
            osx_build_arch: x86_64
            rust_target: x86_64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Add the Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install ninja
        run: brew install ninja

      # server-release configures once and builds only the duckdb_otlp_server target, so this
      # does not pay for the extension, the shell and the unittest binary as `make release` would.
      - name: Build the daemon
        env:
          GEN: ninja
          OSX_BUILD_ARCH: ${{ matrix.osx_build_arch }}
          OVERRIDE_GIT_DESCRIBE: ${{ env.DAEMON_DUCKDB_VERSION }}
        run: make server-release

      - name: Check the binary's architecture
        shell: bash
        run: |
          set -euo pipefail
          BIN=build/release/extension/otlp/duckdb-otlp
          file "$BIN"
          # Guards the cross-compile: a silently-native x86_64 job would ship an arm64 binary.
          lipo -archs "$BIN" | tr ' ' '\n' | grep -qx '${{ matrix.osx_build_arch }}'
          # Only the native slice can run here; the x86_64 one needs Rosetta.
          if [ '${{ matrix.osx_build_arch }}' = 'arm64' ]; then
            "$BIN" version
          fi

      - name: Upload daemon artifact
        uses: actions/upload-artifact@v7
        with:
          # Deliberately NOT the `duckdb-otlp-server-*` prefix the Linux artifacts use: that is
          # the glob docker-image downloads, and it must not pick up Darwin binaries.
          name: duckdb-otlp-${{ matrix.arch }}
          path: build/release/extension/otlp/duckdb-otlp
          if-no-files-found: error

  docker-image:
    name: Build and publish server image
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    needs:
      - duckdb-stable-build
      - code-quality-check
      - daemon-linux
      - docker-smoke
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download daemon artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: duckdb-otlp-server-*
          path: daemon-artifacts

      - name: Prepare Docker build context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docker-bin/amd64 docker-bin/arm64
          cp daemon-artifacts/duckdb-otlp-server-amd64/duckdb-otlp-server docker-bin/amd64/duckdb-otlp-server
          cp daemon-artifacts/duckdb-otlp-server-arm64/duckdb-otlp-server docker-bin/arm64/duckdb-otlp-server
          chmod +x docker-bin/amd64/duckdb-otlp-server docker-bin/arm64/duckdb-otlp-server

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/duckdb-otlp-server/Dockerfile
          target: runtime-prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-runtime
          cache-to: type=gha,mode=max,scope=docker-runtime

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5.5
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5.5
      extension_name: otlp

  # Attach the daemon binaries to the GitHub release for a v* tag. Nothing is compiled here:
  # these are the artifacts daemon-linux and daemon-macos already produced for this commit,
  # and the gate on docker-smoke means a binary that failed the e2e never reaches a release.
  daemon-release:
    name: Attach daemon binaries to the release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - duckdb-stable-build
      - code-quality-check
      - daemon-linux
      - daemon-macos
      - docker-smoke
    steps:
      - name: Download daemon artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: duckdb-otlp-*
          path: daemon-artifacts

      - name: Package binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets stage
          # The two builders name the file differently — the Dockerfile's daemon-export stage
          # calls it duckdb-otlp-server, the macOS build leaves it as duckdb-otlp — so the
          # source paths are spelled out rather than globbed. Everything ships as `duckdb-otlp`.
          declare -A SOURCES=(
            [linux-amd64]=daemon-artifacts/duckdb-otlp-server-amd64/duckdb-otlp-server
            [linux-arm64]=daemon-artifacts/duckdb-otlp-server-arm64/duckdb-otlp-server
            [darwin-amd64]=daemon-artifacts/duckdb-otlp-darwin-amd64/duckdb-otlp
            [darwin-arm64]=daemon-artifacts/duckdb-otlp-darwin-arm64/duckdb-otlp
          )
          for platform in "${!SOURCES[@]}"; do
            source="${SOURCES[$platform]}"
            test -f "$source" || { echo "missing artifact: $source" >&2; exit 1; }
            # A release asset does not carry the executable bit, so ship a tarball that does.
            install -m 0755 "$source" stage/duckdb-otlp
            tar -czf "release-assets/duckdb-otlp-${GITHUB_REF_NAME}-${platform}.tar.gz" -C stage duckdb-otlp
            rm stage/duckdb-otlp
          done
          ( cd release-assets && sha256sum *.tar.gz > SHA256SUMS )
          ls -l release-assets

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The job never checks out the repo (it only needs the downloaded artifacts), so gh
          # has no git remote to infer the target from and fails with "not a git repository".
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The tag may have been pushed on its own or created by publishing a release in the
          # UI, so handle both orders. Creating it here publishes a release, which is what
          # triggers pages.yml to build and attach the extension repository.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
